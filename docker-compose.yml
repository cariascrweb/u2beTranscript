services:
  yt-transcript:
    build: .
    container_name: yt-transcript
    restart: unless-stopped
    env_file:
      - path: .env        # Turnstile keys, optional DAILY_LIMIT / PER_IP_DAILY_LIMIT
        required: false
    ports:
      - "127.0.0.1:8090:8000"   # only reachable from salitral itself; the tunnel uses the container name
    volumes:
      - ./cookies:/cookies:ro   # optional cookies.txt (must be readable by uid 10001)
    # --- hardening ---
    read_only: true             # container filesystem is read-only...
    tmpfs:
      - /tmp                    # ...except /tmp, used for subtitle downloads
    cap_drop:
      - ALL                     # no Linux capabilities
    security_opt:
      - no-new-privileges:true  # nothing inside can gain extra privileges
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    labels:
      - com.centurylinklabs.watchtower.enable=false   # locally built image, nothing to pull

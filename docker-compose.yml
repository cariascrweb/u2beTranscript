services:
  yt-transcript:
    build: .
    container_name: yt-transcript
    restart: unless-stopped
    env_file:
      - path: .env        # TURNSTILE_SITE_KEY / TURNSTILE_SECRET_KEY
        required: false
    ports:
      - "8090:8000"          # LAN access; optional if the tunnel reaches it by container name
    volumes:
      - ./cookies:/cookies:ro   # optional: put a cookies.txt here if YouTube keeps returning 429
    tmpfs:
      - /tmp
    labels:
      - com.centurylinklabs.watchtower.enable=false   # locally built image, nothing to pull
